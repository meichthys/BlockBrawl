<svg viewBox="0 0 1280 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Block Brawl" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="glow" cx="50%" cy="-10%" r="75%">
      <stop offset="0%" stop-color="#2b2047"/>
      <stop offset="65%" stop-color="#2b2047" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6b4a"/>
      <stop offset="100%" stop-color="#3fd8c9"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" fill="#120e1c"/>
  <rect width="1280" height="320" fill="url(#glow)"/>

  <!-- decorative tetrominoes, left (J piece) -->
  <g opacity="0.95">
    <rect x="70"  y="120" width="34" height="34" rx="6" fill="#4f7cff"/>
    <rect x="70"  y="156" width="34" height="34" rx="6" fill="#4f7cff"/>
    <rect x="70"  y="192" width="34" height="34" rx="6" fill="#4f7cff"/>
    <rect x="106" y="192" width="34" height="34" rx="6" fill="#4f7cff"/>
  </g>
  <g opacity="0.9">
    <rect x="150" y="70" width="30" height="30" rx="6" fill="#ffd23f"/>
    <rect x="182" y="70" width="30" height="30" rx="6" fill="#ffd23f"/>
    <rect x="150" y="102" width="30" height="30" rx="6" fill="#ffd23f"/>
    <rect x="182" y="102" width="30" height="30" rx="6" fill="#ffd23f"/>
  </g>

  <!-- decorative tetrominoes, right (S + T pieces) -->
  <g opacity="0.95">
    <rect x="1096" y="150" width="34" height="34" rx="6" fill="#5be37a"/>
    <rect x="1130" y="150" width="34" height="34" rx="6" fill="#5be37a"/>
    <rect x="1062" y="184" width="34" height="34" rx="6" fill="#5be37a"/>
    <rect x="1096" y="184" width="34" height="34" rx="6" fill="#5be37a"/>
  </g>
  <g opacity="0.9">
    <rect x="1110" y="66"  width="30" height="30" rx="6" fill="#b56cff"/>
    <rect x="1076" y="98"  width="30" height="30" rx="6" fill="#b56cff"/>
    <rect x="1110" y="98"  width="30" height="30" rx="6" fill="#b56cff"/>
    <rect x="1144" y="98"  width="30" height="30" rx="6" fill="#b56cff"/>
  </g>

  <!-- title -->
  <text x="640" y="172" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="88" letter-spacing="2">
    <tspan fill="#ff6b4a">BLOCK</tspan><tspan fill="#f3eefb"> </tspan><tspan fill="#3fd8c9">BRAWL</tspan>
  </text>

  <!-- accent rule -->
  <rect x="490" y="196" width="300" height="4" rx="2" fill="url(#accent)"/>

  <!-- tagline -->
  <text x="640" y="236" text-anchor="middle" font-family="Arial, sans-serif" font-weight="600" font-size="20" letter-spacing="1" fill="#9d92b8">
    REAL-TIME COMPETITIVE TETRIS FOR TWO
  </text>
</svg>
